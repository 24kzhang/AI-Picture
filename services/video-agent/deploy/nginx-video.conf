# Include in the existing gallery server block. Keep Node/Studio listeners on loopback.
location ^~ /api/video-editor/ {
    client_max_body_size 105m;
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $video_connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}
# Define this map in nginx's http {} block:
# map $http_upgrade $video_connection_upgrade { default upgrade; '' close; }
