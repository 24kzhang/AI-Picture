# 修图 Agent 开发环境编排（云图库融合版）
# 用法：docker compose -f services/retouch-agent/docker/compose.yml up -d --wait
# 说明：仅提供基础设施（PostgreSQL / Redis / RustFS），API 与 Worker 默认在宿主机运行以便热重载；
#       需要容器化运行时使用 deploy profile。

name: cloud-gallery-agent

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "7311:5432"
    environment:
      POSTGRES_USER: retouch
      POSTGRES_PASSWORD: retouch_dev
      POSTGRES_DB: retouch
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retouch -d retouch"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "7312:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 兼容对象存储：COS 适配（AGT-02）完成前的开发存储
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: rustfs server /data --console-address ":9001"
    ports:
      - "7313:9000"
      - "7314:9001"
    environment:
      RUSTFS_ACCESS_KEY: retouch
      RUSTFS_SECRET_KEY: retouch_dev
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 容器化运行 Agent（可选）：docker compose --profile deploy up -d
  agent-api:
    profiles: ["deploy"]
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 7302
    ports:
      - "7302:7302"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://retouch:retouch_dev@postgres:5432/retouch
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: http://localhost:7313
    volumes:
      - cv_models:/root/.u2net
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rustfs: { condition: service_healthy }

  agent-worker:
    profiles: ["deploy"]
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: arq app.worker.WorkerSettings
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://retouch:retouch_dev@postgres:5432/retouch
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: http://localhost:7313
    volumes:
      - cv_models:/root/.u2net
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rustfs: { condition: service_healthy }

volumes:
  pg_data:
  redis_data:
  rustfs_data:
  cv_models:
